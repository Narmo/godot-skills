# OpenAI / Codex CLI extension for godot-pck-encryption
# Safely ignored by other agents per Agent Skills Open Standard

policy:
  safe: true
  no_network: false

when_to_use:
  - "encrypting a Godot export PCK"
  - "compiling Godot export templates with an encryption key"
  - "setting SCRIPT_AES256_ENCRYPTION_KEY or GODOT_SCRIPT_ENCRYPTION_KEY"
  - "choosing Godot encryption include/exclude filters"
  - "fixing 'MD5 sum of the decrypted file does not match' in a Godot export"
